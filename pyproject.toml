[project]
name = "modal-lib"
version = "0.1.0"
description = "Run training jobs on Modal GPUs, and record the wall-clock time and cost of each phase"
requires-python = ">=3.12"
dependencies = ["modal>=1.6.2"]

[project.scripts]
mlib = "modal_lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The examples, so that `mlib` works in this repo.
[tool.modal-lib]
app = "modal-lib-example"
file = "examples/jobs.py"
function = "train"
recipes = "examples/recipes.json"
