[project]
name = "modal-lib"
version = "0.2.0"
description = "Run and serve commands on Modal GPUs from recipes, and record the time, GPU use and cost of each run"
requires-python = ">=3.12"
dependencies = ["modal>=1.6.2"]

[project.scripts]
mlib = "modal_lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
